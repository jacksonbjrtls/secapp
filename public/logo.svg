  <!-- Center Icon: Beautiful Interlocking Security Shield + Checkmark Pattern -->
  <path d="M256,150 C290,150 315,175 315,205 C315,220 305,235 290,245 C270,258 250,270 250,290 L250,305" fill="none" stroke="#047857" stroke-width="28" stroke-linecap="round" />
  <circle cx="250" cy="345" r="16" fill="#047857" />
  
  <!-- High-contrast operational checkmark looping across the emblem -->
