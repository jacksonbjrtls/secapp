  <path d="M256,70 C350,70 410,105 410,105 C410,105 425,270 365,370 C315,450 256,462 256,462 C256,462 197,450 147,370 C87,270 102,105 102,105 C102,105 162,70 256,70 Z" fill="url(#shield-grad)" opacity="0.15" />
  
