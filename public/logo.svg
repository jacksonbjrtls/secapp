<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 3D Gel / Specular Lighting Filter for that glossy look -->
    <filter id="gel-3d-text" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Standard drop shadow cast by the gel letters -->
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
      
      <!-- Create a heightmap using a gaussian blur of the text outline -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      
      <!-- Specular diffuse lighting to get the high sheen specular white glints -->
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1.4" specularExponent="30" lighting-color="#ffffff" result="spec">
        <fePointLight x="-120" y="-180" z="250" />
      </feSpecularLighting>
      
      <!-- Mask the specular highlights to the original text geometry -->
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="highlights" />
      
      <!-- Merge original text graphic with 3D specular highlight -->
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="highlights" />
      </feMerge>
    </filter>

    <!-- Lush rich green gel gradient -->
    <linearGradient id="lush-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21e67b" />
      <stop offset="35%" stop-color="#14ba5f" />
      <stop offset="100%" stop-color="#0c8740" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square White Tile (exactly like the homescreen app icon) -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="#ffffff" stroke="#f1f5f9" stroke-width="4" />

  <!-- Centered "SecApp" text styled with custom web-safe font-family and 3D gel filter -->
  <text 
    x="50%" 
    y="51%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'SF Pro Display', Inter, 'Helvetica Neue', Arial, sans-serif" 
    font-size="108" 
    font-weight="800" 
    letter-spacing="-2px" 
    fill="url(#lush-green)" 
    filter="url(#gel-3d-text)"
  >SecApp</text>
</svg>
